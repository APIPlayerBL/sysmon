[package]
name = "aida67"
version = "0.1.0"
description = "Independent system information & monitoring desktop app (Rust + Tauri 2)."
authors = ["aida67"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sysmon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tempfile = "3"
windows = { version = "0.61", features = [
  "Win32_System_Wmi",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_Foundation",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_Storage_FileSystem",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
